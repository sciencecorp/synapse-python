name: main

on:
  push:
    tags:
      - "v*"
  # release-tag.yml starts this on the new tag (a tag it pushes can't trigger
  # workflows). Only meaningful with a v* tag as the ref.
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  sdist:
    name: Build source distribution
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
      - uses: actions/setup-python@v5
      - name: Prep repo
        run: |
          pip install -r requirements.txt
          make
      - name: Build sdist
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-testpypi:
    name: Publish to testpypi
    needs: [sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/legacy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List files
        run: ls -la dist/

      - name: Publish package distributions to testpypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true

  validate-test-pypi-release:
    runs-on: ubuntu-latest
    needs: publish-testpypi
    steps:
      - name: wait for package to be available
        run: sleep 180

      - name: install test pypi release
        run: |
          # Get version from GitHub ref (removes 'refs/tags/v' prefix)
          VERSION=${GITHUB_REF_NAME#v}
          pip install --extra-index-url https://test.pypi.org/simple/ science-synapse==$VERSION

      - name: validate
        run: |
          # Run Help
          synapsectl --help

          # Run Simulator
          synapse-sim --iface-ip 127.0.0.1 --rpc-port 50051 &
          sleep 2

          synapsectl -u 127.0.0.1:50051 info

          # Kill Simulator
          kill $(jobs -p)

  publish-pypi:
    name: Publish to pypi
    needs: [validate-test-pypi-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url:  https://pypi.org/p/science-synapse/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish package distributions to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  github-release:
    # Creates the GitHub Release once the package is on PyPI.
    name: Create GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Notes come from the changelog in the release PR this commit
            # merged (release-open.yml). A tag pushed by hand has no release
            # PR, so fall back to GitHub's list of PRs since the previous tag.
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(any(.labels[]; .name == "release"))][0].body // ""' > pr_body.md
            awk '/<!-- changelog:start -->/{f=1;next}/<!-- changelog:end -->/{f=0}f' pr_body.md > pr_notes.md
            if grep -q '[^[:space:]]' pr_notes.md; then
              gh release create "$TAG" --verify-tag --title "$TAG" --notes-file pr_notes.md
            else
              # Without a start tag, the first generated release would list every PR ever merged.
              PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
              gh release create "$TAG" --verify-tag --generate-notes ${PREV:+--notes-start-tag "$PREV"}
            fi
          fi
